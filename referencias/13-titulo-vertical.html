<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden;position:relative}
.particles{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(200,164,78,0.08) 0%,transparent 60%)}
.content{text-align:center;z-index:1;padding:0 60px}
.badge{font-size:16px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:#C8A44E;border:1px solid rgba(200,164,78,0.3);padding:10px 32px;display:inline-block;margin-bottom:48px}
h1{font-size:80px;font-weight:900;color:#fff;line-height:1.15;margin-bottom:24px}
h1 span{color:#C8A44E}
.sub{font-size:26px;color:#888;font-weight:300;margin-top:24px;line-height:1.5}
.sub strong{color:#C8A44E}
.logo-area{position:absolute;bottom:80px;font-size:18px;color:rgba(200,164,78,0.4);font-weight:700;letter-spacing:4px}
.glow{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#C8A44E,transparent)}
</style>
</head>
<body>
<div class="particles"></div>
<div class="content">
    <div class="badge">Ferramenta Profissional</div>
    <h1>MCP<br>TradingView<br><span>Gold</span></h1>
    <p class="sub">Dados em tempo real do <strong>XAUUSD</strong><br>direto no Claude AI</p>
</div>
<div class="logo-area">RICHARTRADER</div>
<div class="glow"></div>
</body>
</html>
