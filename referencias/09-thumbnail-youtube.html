<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%,rgba(200,164,78,0.1) 0%,transparent 60%)}
.border{position:absolute;inset:8px;border:2px solid rgba(200,164,78,0.25);border-radius:8px}
.content{z-index:1;display:flex;align-items:center;width:100%;padding:0 60px}
.left{flex:1;display:flex;align-items:center;justify-content:center}
.avatar-placeholder{width:280px;height:320px;border-radius:16px;background:linear-gradient(135deg,rgba(200,164,78,0.15),rgba(200,164,78,0.05));border:2px solid rgba(200,164,78,0.3);display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(200,164,78,0.5);text-align:center;font-weight:600;overflow:hidden}
.avatar-placeholder img{width:100%;height:100%;object-fit:cover}
.right{flex:1;padding-left:40px}
.right h1{font-size:64px;font-weight:900;color:#fff;line-height:1.1;margin-bottom:8px}
.right h1 span{color:#C8A44E}
.right h2{font-size:40px;font-weight:900;color:#C8A44E;line-height:1.1}
.badge-price{position:absolute;top:20px;right:20px;background:#E74C3C;color:#fff;font-size:24px;font-weight:900;padding:10px 24px;border-radius:8px}
.logo{position:absolute;top:20px;left:20px;font-size:16px;font-weight:700;color:rgba(200,164,78,0.6);letter-spacing:3px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="border"></div>
<div class="logo">RICHARTRADER</div>
<div class="badge-price">R$ 97</div>
<div class="content">
    <div class="left">
        <div class="avatar-placeholder"><img src="png/caricatura.png" alt="Rick"></div>
    </div>
    <div class="right">
        <h1>OURO AO VIVO</h1>
        <h2>NO CLAUDE <span>AI</span></h2>
    </div>
</div>
</body>
</html>
