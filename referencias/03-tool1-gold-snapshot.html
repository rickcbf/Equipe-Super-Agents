<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(200,164,78,0.05) 0%,transparent 60%)}
.card{display:flex;align-items:center;gap:80px;z-index:1;padding:0 120px}
.num-circle{width:180px;height:180px;border-radius:50%;border:3px solid rgba(200,164,78,0.4);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:80px;font-weight:700;color:#C8A44E;background:rgba(200,164,78,0.06);flex-shrink:0}
.info{flex:1}
.info h2{font-size:56px;font-weight:900;color:#fff;margin-bottom:16px}
.info h2 span{color:#C8A44E}
.info p{font-size:24px;color:#999;line-height:1.6}
.info .tags{display:flex;gap:16px;margin-top:28px;flex-wrap:wrap}
.info .tag{font-family:'JetBrains Mono',monospace;font-size:16px;color:#C8A44E;border:1px solid rgba(200,164,78,0.3);padding:8px 20px;border-radius:8px;background:rgba(200,164,78,0.06)}
.line{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#C8A44E,transparent)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
    <div class="num-circle">1</div>
    <div class="info">
        <h2>GOLD <span>SNAPSHOT</span></h2>
        <p>Preco, RSI, ADX, MACD e recomendacao<br>em qualquer timeframe. Do minuto ao mensal.</p>
        <div class="tags">
            <span class="tag">RSI</span>
            <span class="tag">ADX</span>
            <span class="tag">MACD</span>
            <span class="tag">EMAs</span>
            <span class="tag">Bollinger</span>
        </div>
    </div>
</div>
<div class="line"></div>
</body>
</html>
