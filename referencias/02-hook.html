<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden;position:relative}
.glitch-bg{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(200,164,78,0.02) 2px,rgba(200,164,78,0.02) 4px)}
h1{font-size:80px;font-weight:900;color:#fff;text-align:center;line-height:1.2;z-index:1;max-width:1400px}
h1 span{color:#C8A44E}
h1 em{font-style:normal;color:#E74C3C;text-decoration:underline;text-decoration-color:rgba(231,76,60,0.4)}
.flash{position:absolute;inset:0;border:3px solid rgba(200,164,78,0.15)}
</style>
</head>
<body>
<div class="glitch-bg"></div>
<div class="flash"></div>
<h1>Voce ainda analisa<br>ouro <em>MANUALMENTE</em><span>?</span></h1>
</body>
</html>
