<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(200,164,78,0.08) 0%,transparent 60%)}
.gold-border{position:absolute;inset:20px;border:2px solid rgba(200,164,78,0.2);border-radius:20px}
.card{display:flex;align-items:center;gap:80px;z-index:1;padding:0 120px}
.num-circle{width:180px;height:180px;border-radius:50%;border:3px solid #C8A44E;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:80px;font-weight:700;color:#C8A44E;background:rgba(200,164,78,0.1);flex-shrink:0;box-shadow:0 0 40px rgba(200,164,78,0.2)}
.info{flex:1}
.info h2{font-size:52px;font-weight:900;color:#fff;margin-bottom:16px}
.info h2 span{color:#C8A44E}
.info p{font-size:22px;color:#999;line-height:1.6;margin-bottom:28px}
.filters{display:flex;flex-direction:column;gap:12px}
.filter{display:flex;align-items:center;gap:16px;padding:14px 24px;border-radius:10px;background:#141414;border:1px solid #222}
.filter-name{font-family:'JetBrains Mono',monospace;font-size:18px;color:#ccc;flex:1}
.filter-status{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#2ECC71;padding:4px 16px;border-radius:6px;background:rgba(46,204,113,0.1);border:1px solid rgba(46,204,113,0.3)}
.verdict{margin-top:24px;text-align:center;font-size:26px;font-weight:900;color:#2ECC71;padding:16px 40px;border:2px solid rgba(46,204,113,0.4);border-radius:12px;background:rgba(46,204,113,0.08);display:inline-block}
.line{position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,#C8A44E,transparent)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="gold-border"></div>
<div class="card">
    <div class="num-circle">5</div>
    <div class="info">
        <h2>CHECK ENTRY <span>FILTERS</span></h2>
        <p>Cinco filtros de entrada automatizados.<br>PASS ou FAIL instantaneo. Acabou o achismo.</p>
        <div class="filters">
            <div class="filter"><span class="filter-name">F1 Trend (EMA 50/200)</span><span class="filter-status">PASS &#10003;</span></div>
            <div class="filter"><span class="filter-name">F2 Structure (S/R)</span><span class="filter-status">PASS &#10003;</span></div>
            <div class="filter"><span class="filter-name">F3 Momentum (RSI/MACD)</span><span class="filter-status">PASS &#10003;</span></div>
            <div class="filter"><span class="filter-name">F4 Session (London/NY)</span><span class="filter-status">PASS &#10003;</span></div>
            <div class="filter"><span class="filter-name">F5 Risk (ADX/Volatility)</span><span class="filter-status">PASS &#10003;</span></div>
        </div>
        <div style="margin-top:24px"><span class="verdict">5/5 &mdash; BUY IS VALID</span></div>
    </div>
</div>
<div class="line"></div>
</body>
</html>
