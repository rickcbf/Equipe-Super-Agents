<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(200,164,78,0.05) 0%,transparent 60%)}
.card{display:flex;align-items:center;gap:80px;z-index:1;padding:0 120px}
.num-circle{width:180px;height:180px;border-radius:50%;border:3px solid rgba(200,164,78,0.4);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:80px;font-weight:700;color:#C8A44E;background:rgba(200,164,78,0.06);flex-shrink:0}
.info{flex:1}
.info h2{font-size:56px;font-weight:900;color:#fff;margin-bottom:16px}
.info h2 span{color:#C8A44E}
.info p{font-size:24px;color:#999;line-height:1.6}
.assets{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px}
.asset{text-align:center;padding:16px;border-radius:10px;background:#141414;border:1px solid #222}
.asset-name{font-size:18px;font-weight:700;color:#fff}
.asset-check{font-size:24px;color:#2ECC71;margin-top:4px}
.line{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#C8A44E,transparent)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
    <div class="num-circle">3</div>
    <div class="info">
        <h2>TECHNICAL <span>ANALYSIS</span></h2>
        <p>Analise tecnica completa pra qualquer ativo.<br>Forex, crypto, indices, acoes.</p>
        <div class="assets">
            <div class="asset"><div class="asset-name">EURUSD</div><div class="asset-check">&#10003;</div></div>
            <div class="asset"><div class="asset-name">BTCUSD</div><div class="asset-check">&#10003;</div></div>
            <div class="asset"><div class="asset-name">SPX500</div><div class="asset-check">&#10003;</div></div>
            <div class="asset"><div class="asset-name">NAS100</div><div class="asset-check">&#10003;</div></div>
        </div>
    </div>
</div>
<div class="line"></div>
</body>
</html>
