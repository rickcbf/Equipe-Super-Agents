<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(200,164,78,0.04) 0%,transparent 60%)}
.content{z-index:1;text-align:center}
.logo-text{font-size:72px;font-weight:900;color:#fff;letter-spacing:4px;margin-bottom:16px}
.logo-text span{color:#C8A44E}
.tagline{font-size:28px;color:#888;font-weight:300;font-style:italic}
.handle{font-size:22px;color:#555;margin-top:32px;letter-spacing:2px}
.line-top{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(200,164,78,0.3),transparent)}
.line-bot{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(200,164,78,0.3),transparent)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="line-top"></div>
<div class="line-bot"></div>
<div class="content">
    <div class="logo-text">Richar<span>Trader</span></div>
    <div class="tagline">Opere com inteligencia.</div>
    <div class="handle">@richartrader</div>
</div>
</body>
</html>
