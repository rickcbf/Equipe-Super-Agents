<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden;position:relative}
.particles{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(200,164,78,0.06) 0%,transparent 70%)}
.glow-line{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#C8A44E,transparent)}
.glow-line.top{bottom:auto;top:0}
.content{text-align:center;z-index:1}
.badge{font-size:18px;font-weight:700;letter-spacing:8px;text-transform:uppercase;color:#C8A44E;border:1px solid rgba(200,164,78,0.3);padding:10px 40px;display:inline-block;margin-bottom:48px}
h1{font-size:96px;font-weight:900;color:#fff;line-height:1.1;margin-bottom:16px}
h1 span{color:#C8A44E}
.sub{font-size:28px;color:#888;font-weight:300;margin-top:24px}
.sub strong{color:#C8A44E}
.logo-area{position:absolute;bottom:60px;right:80px;font-size:20px;color:rgba(200,164,78,0.5);font-weight:700;letter-spacing:4px}
</style>
</head>
<body>
<div class="particles"></div>
<div class="glow-line top"></div>
<div class="glow-line"></div>
<div class="content">
    <div class="badge">Ferramenta Profissional</div>
    <h1>MCP TradingView<br><span>Gold</span></h1>
    <p class="sub">Dados em tempo real do <strong>XAUUSD</strong> direto no Claude AI</p>
</div>
<div class="logo-area">RICHARTRADER</div>
</body>
</html>
