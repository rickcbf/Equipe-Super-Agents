<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 50%,rgba(200,164,78,0.06) 0%,transparent 60%)}
.content{z-index:1;display:flex;align-items:center;gap:80px;padding:0 120px;width:100%}
.avatar-area{width:340px;height:400px;border-radius:20px;background:linear-gradient(135deg,rgba(200,164,78,0.1),rgba(200,164,78,0.03));border:2px solid rgba(200,164,78,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar-placeholder{font-size:20px;color:rgba(200,164,78,0.5);text-align:center;font-weight:600}
.avatar-area img{width:100%;height:100%;object-fit:cover;border-radius:20px}
.info{flex:1}
.name{font-size:48px;font-weight:900;color:#fff;margin-bottom:4px}
.name span{color:#C8A44E}
.handle{font-size:20px;color:#666;margin-bottom:36px;letter-spacing:2px}
.credentials{list-style:none;padding:0}
.credentials li{font-size:22px;color:#ccc;padding:14px 0;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:16px}
.credentials li:last-child{border:none}
.cred-icon{color:#C8A44E;font-size:20px;font-weight:700}
.logo-area{position:absolute;top:60px;right:80px;font-size:18px;color:rgba(200,164,78,0.4);font-weight:700;letter-spacing:4px}
.line{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#C8A44E,transparent)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="logo-area">RICHARTRADER</div>
<div class="content">
    <div class="avatar-area">
        <img src="png/caricatura.png" alt="Rick">
    </div>
    <div class="info">
        <div class="name">Rick, <span>RicharTrader</span></div>
        <div class="handle">@richartrader</div>
        <ul class="credentials">
            <li><span class="cred-icon">&#9670;</span> Trader profissional de XAUUSD</li>
            <li><span class="cred-icon">&#9670;</span> Desenvolvedor de EAs para MT5</li>
            <li><span class="cred-icon">&#9670;</span> Criador do metodo Elite Trader</li>
            <li><span class="cred-icon">&#9670;</span> Ferramentas de trading com IA</li>
        </ul>
    </div>
</div>
<div class="line"></div>
</body>
</html>
